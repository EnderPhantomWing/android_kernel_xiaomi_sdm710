name: Build ReSukiSU Kernel for Mi 8 SE (SDM710)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
    - cron: '0 12 * * 5'
    - cron: '0 12 * * 3'
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ---------- 1. 安装构建依赖 ----------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            kmod cpio binutils cmake binutils-aarch64-linux-gnu git wget pahole \
            automake flex lzop bison gperf build-essential zip curl zlib1g-dev \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools \
            pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev \
            pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl \
            libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev \
            xsltproc unzip dwarves device-tree-compiler python3 ccache git-lfs gnupg \
            imagemagick libelf-dev libncurses5-dev libsdl1.2-dev gpart fuse2fs \
            e2fsck-static icu-doc rsync adb fastboot libstdc++6 python-is-python3 \
            gcc-aarch64-linux-gnu

          # 安装 Clang / LLVM (使用 LLVM 15)
          sudo apt-get install -y clang-15 lld-15 llvm-15
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-15 100

      # ---------- 2. 迁出内核源码到 kernel/msm-4.9 ----------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: EnderPhantomWing/android_kernel_xiaomi_sdm710
          path: kernel/msm-4.9
          fetch-depth: 1

      # ---------- 3. 设置构建日期环境变量 ----------
      - name: Set build date
        run: echo "BUILD_DATE=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      # ---------- 4. 应用 Rekernel 补丁 ----------
      - name: Rekernel patches
        run: |
          cd kernel/msm-4.9
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_patches.sh" -o rekernel_patches.sh
          chmod +x rekernel_patches.sh
          bash rekernel_patches.sh
          mkdir -p drivers/rekernel
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_extra.patch" -o rekernel_extra.patch
          patch -p1 < rekernel_extra.patch || true

      # ---------- 5. 准备构建 + syscall_hook ----------
      - name: Prepare build and syscall hook
        run: |
          cd kernel/msm-4.9
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" -o syscall_hook_patches.sh
          chmod +x syscall_hook_patches.sh
          bash syscall_hook_patches.sh

      # ---------- 6. 配置内核 (使用 sirius_defconfig) ----------
      - name: Configure kernel
        run: |
          cd kernel/msm-4.9
          # 关键：加入 ARCH=arm64
          make O=out ARCH=arm64 CC="clang" LLVM=1 sirius_defconfig
          make O=out CC="clang" LLVM=1 sirius_defconfig

          # 修改 KSU 相关配置
          ./scripts/config --file out/.config \
            -d CONFIG_KSU_TRACEPOINT_HOOK \
            -e CONFIG_KSU_MANUAL_HOOK

          # 启用 namespaces 及其他所需选项
          ./scripts/config --file out/.config \
            -d CONFIG_USER_NS \
            -e CONFIG_PID_NS \
            -e CONFIG_IPC_NS \
            -e CONFIG_CHECKPOINT_RESTORE \
            -e CONFIG_SYSVIPC \
            -e CONFIG_CGROUP_CPU=y \
            -e CONFIG_CGROUP_CPUACCT=y \
            -e CONFIG_CPUSETS=y \
            -e CONFIG_CGROUP_PIDS=y \
            -e CONFIG_MEMCG=y \
            -e CONFIG_CGROUP_DEVICE=y \
            -e CONFIG_CGROUP_FREEZER=y \
            -e CONFIG_CGROUP_SCHED=y

          ./scripts/config --file out/.config --enable CONFIG_CGROUP_PIDS
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_IO
          ./scripts/config --file out/.config --enable CONFIG_CPUSETS
          ./scripts/config --file out/.config --enable CONFIG_MEMCG
          ./scripts/config --file out/.config --enable CONFIG_DEVTMPFS
          ./scripts/config --file out/.config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          ./scripts/config --file out/.config --enable CONFIG_TMPFS_POSIX_ACL
          ./scripts/config --file out/.config --enable CONFIG_TMPFS_XATTR

      # ---------- 7. 开始编译 ----------
      - name: Build kernel
        run: |
          cd kernel/msm-4.9
          # 同样加入 ARCH=arm64
          make O=out ARCH=arm64 CC="clang" LLVM=1 -j$(nproc)
          make O=out CC="clang" LLVM=1 -j$(nproc)

      # ---------- 8. 打包 AnyKernel3 ZIP ----------
      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i '584s|ui_print " " "Done!";|ui_print " "; ui_print "Mi8SE ReSukiSU 内核构建完毕"; ui_print "祝你玩的愉快！";|' AnyKernel3/META-INF/com/google/android/update-binary

          cp kernel/msm-4.9/out/arch/arm64/boot/Image AnyKernel3/
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find kernel/msm-4.9/out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;

          cd AnyKernel3
          rm -f anykernel.sh
          wget https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/anykernel.sh
          zip -r9 ../ReSukiSU-MI8SE-WithoutTWRP-${{ env.BUILD_DATE }}.zip * -x .git* README.md *placeholder

      # ---------- 9. 打包 Boot Image ----------
      - name: Pack Boot Image
        run: |
          mkdir -p boot_pack
          cd boot_pack
          wget https://raw.githubusercontent.com/miaizhe/magiskboot-linux/refs/heads/main/x86_64/magiskboot
          chmod +x magiskboot
          curl -fL "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/boot_a.img" -o boot_origin.img
          ./magiskboot unpack boot_origin.img

          if [ ! -f "../kernel/msm-4.9/out/arch/arm64/boot/Image" ]; then
            echo "错误：编译出的 Image 文件不存在，请检查编译步骤！"
            exit 1
          fi
          cp ../kernel/msm-4.9/out/arch/arm64/boot/Image kernel
          ./magiskboot repack boot_origin.img ../boot-ReSukiSU-Mi8SE-WithoutTWRP--${{ env.BUILD_DATE }}.img

      # ---------- 10. 上传制品到 Actions ----------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            ReSukiSU-MI8SE-WithoutTWRP-${{ env.BUILD_DATE }}.zip
            boot-ReSukiSU-Mi8SE-WithoutTWRP--${{ env.BUILD_DATE }}.img

      # ---------- 11. （可选）发布到 GitHub Release ----------
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')   # 仅在打 tag 时触发
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ReSukiSU-MI8SE-WithoutTWRP-${{ env.BUILD_DATE }}.zip
            boot-ReSukiSU-Mi8SE-WithoutTWRP--${{ env.BUILD_DATE }}.img
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
